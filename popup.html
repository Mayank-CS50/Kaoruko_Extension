<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Toggle</title>
    <style>
        body {
            min-height: 80px;
            min-width: 160px;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            font-family: 'Quicksand', 'Poppins', 'Segoe UI', 'Arial Rounded MT Bold', sans-serif;
        }
        .glass {
            background: rgba(20,20,20,0.72);
            box-shadow: 0 4px 16px 0 rgba(0,0,0,0.28);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 16px;
            border: 1px solid rgba(40,40,40,0.22);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #toggleExtn {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.10);
            transition: background 0.2s, color 0.2s;
            margin-top: 8px;
            cursor: pointer;
        }
        #toggleExtn.on {
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            color: #fff;
        }
        #toggleExtn.off {
            background: linear-gradient(90deg, #ff5858 0%, #f09819 100%);
            color: #fff;
        }
        .toggle-label {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.18), 0 1px 2px rgba(255,255,255,0.12);
            letter-spacing: 0.5px;
        }
        .toggle-timer {
            font-size: 13px;
            margin-bottom: 4px;
            color: #ffd700;
            display: none;
        }
        #timerBtn {
            margin-top: 6px;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
            border: none;
            background: #ffd700;
            color: #222;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="glass">
        <span class="toggle-label" id="toggleLabel">Extension is OFF</span>
        <button id="toggleExtn" class="off">Turn Extension ON</button>
        <span class="toggle-timer" id="toggleTimer" style="display:none;font-size:13px;margin-bottom:4px;color:#ffd700;"></span>
        <button id="timerBtn" style="margin-top:6px;padding:6px 12px;font-size:12px;border-radius:8px;border:none;background:#ffd700;color:#222;font-weight:600;cursor:pointer;">Turn OFF for 5 min</button>
        
        <hr style="width:100%; border:0; border-top:1px solid rgba(255,255,255,0.2); margin: 12px 0;">
        
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px;">
            <label for="delaySlider" style="color: #fff; font-size: 13px; margin-bottom: 4px; font-weight: 600;">Delay: <span id="delayValue">2</span>s</label>
            <input type="range" id="delaySlider" min="0" max="10" value="2" style="width: 100%;">
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
            <div>
                <label style="color:#fff; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
                    YouTube
                    <input type="checkbox" id="toggleYoutube" checked style="cursor:pointer; width:16px; height:16px;">
                </label>
                <div id="timerYoutube" style="display:none; color:#ffd700; font-size:11px; text-align:right; margin-top:2px;"></div>
            </div>
            <div>
                <label style="color:#fff; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
                    WhatsApp
                    <input type="checkbox" id="toggleWhatsapp" checked style="cursor:pointer; width:16px; height:16px;">
                </label>
                <div id="timerWhatsapp" style="display:none; color:#ffd700; font-size:11px; text-align:right; margin-top:2px;"></div>
            </div>
            <div>
                <label style="color:#fff; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
                    Instagram
                    <input type="checkbox" id="toggleInstagram" checked style="cursor:pointer; width:16px; height:16px;">
                </label>
                <div id="timerInstagram" style="display:none; color:#ffd700; font-size:11px; text-align:right; margin-top:2px;"></div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
